<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khani Solutions</title>
    <meta
      name="description"
      content="Khani Solutions service pages. Open AI Solutions for practical automation services for local businesses."
    />
    <link rel="canonical" href="https://khanisolutions.com/AISolutions/" />
    <meta http-equiv="refresh" content="0; url=/AISolutions/" />
    <style>
      :root {
        color-scheme: dark;
        --logo-navy: #081126;
        --logo-gold: #b89050;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #fbfaf6;
        background: var(--logo-navy);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 34rem);
        text-align: center;
      }

      img {
        width: 76px;
        height: 76px;
        margin: 0 auto 1.25rem;
        border-radius: 14px;
        background: #fff;
      }

      h1 {
        margin: 0 0 0.75rem;
        color: var(--logo-gold);
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 0.95;
      }

      p {
        margin: 0 0 1.5rem;
        color: rgba(251, 250, 246, 0.78);
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.125rem;
        border: 1px solid rgba(184, 144, 80, 0.75);
        border-radius: 999px;
        color: #081126;
        background: var(--logo-gold);
        font-weight: 800;
        text-decoration: none;
      }
    </style>
    <script>
      window.location.replace(`/AISolutions/${window.location.search}${window.location.hash}`);
    </script>
  </head>
  <body>
    <main>
      <img src="assets/khani-solutions-logo.svg" alt="" />
      <h1>Khani Solutions</h1>
      <p>Opening AI Solutions.</p>
      <a href="/AISolutions/">Open AI Solutions</a>
    </main>
  </body>
</html>
