<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Khani Solutions</title>
</head>
<body>
<main>
  <h1 id="title">Page not found</h1>
  <p id="archive" hidden><a id="download">Download the ZIP on GitHub</a></p>
  <p><a href="/">Return to Khani Solutions</a></p>
</main>
<script>
  if (/\.zip\/?$/i.test(location.pathname)) {
    fetch('/assets/study-downloads.json')
      .then(response => response.ok ? response.json() : {})
      .then(downloads => {
        const source = decodeURIComponent(location.pathname).replace(/\/$/, '');
        const target = downloads[source];
        if (!target?.startsWith('https://raw.githubusercontent.com/mrkhani88/khani-solutions-site/')) return;
        document.getElementById('title').textContent = 'Study download';
        document.getElementById('download').href = target;
        document.getElementById('archive').hidden = false;
        location.replace(target);
      })
      .catch(() => {});
  }
</script>
</body>
</html>
