name: Deploy public website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh public Scholar snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/scholar_sync.py --keep-last-good

      - name: Save verified Scholar snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- assets/scholar/profile.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/scholar/profile.json
            git commit -m "Refresh public Google Scholar snapshot"
            git push origin HEAD:main
          fi

      - name: Build portfolio
        run: python3 scripts/build_portfolio.py

      - name: Prepare public site
        run: |
          mkdir -p _site
          cp -R AISolutions assets _site/
          cp index.html styles.css script.js service-modal.css service-modal.js contact-layout.css responsive-panels.css styles-feed.css CNAME _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
